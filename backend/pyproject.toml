[project]
name = "resume-tailor-ai-backend"
version = "0.1.0"
description = "Backend API foundation for AlignCV."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.23.0",
  "python-multipart>=0.0.6",
  "PyMuPDF>=1.22.0",
  "sentence-transformers>=2.2.2",
  "numpy>=1.26.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "structlog>=23.3.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N", "Q", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["app/tests"]
